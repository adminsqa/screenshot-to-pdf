<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Screenshot to PDF</title>
<style>
:root{color-scheme:light dark;font:16px/1.5 system-ui;background:Canvas;color:CanvasText}
*{box-sizing:border-box} body{margin:0} main{max-width:680px;margin:auto;padding:24px}
h1{line-height:1.15;margin:0 0 8px;font-size:clamp(1.75rem,5vw,2.5rem);letter-spacing:-.04em}
p{margin:0 0 16px}.muted{color:GrayText;font-size:.92rem}
fieldset{border:0;margin:0;padding:0;min-width:0} .picker{display:block;border:1px dashed GrayText;border-radius:12px;padding:16px;margin:16px 0}
input[type=file]{display:block;max-width:100%;margin-top:8px}
li{padding:5px 0}.row,.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.name{flex:1 1 10rem;overflow-wrap:anywhere}
button,select,a.download{font:inherit;padding:5px 10px;border:1px solid GrayText;border-radius:7px}button:not(:disabled),select,a{cursor:pointer}
.primary,a.download{background:#146350;color:white;border-color:#146350} .primary:disabled{opacity:.5}
.actions{margin-top:16px} #status{margin-top:12px;min-height:1.5em} [hidden]{display:none!important}
</style>
</head>
<body><main>
<h1>Screenshot to PDF</h1>
<p>Put your images into one attachment, one image per page.</p>
<fieldset id="controls">
<label class="picker">Choose screenshots
<input id="images" type="file" multiple accept="image/png,image/jpeg,image/webp">
<span class="muted">PNG, JPEG or WebP · up to 50 images</span>
</label>
<ol id="list" aria-label="Page order" hidden></ol>
<label for="quality">Quality</label>
<select id="quality"><option value="sharp">Sharp text</option><option value="compact">Smaller file</option></select>
<div class="actions"><button class="primary" id="make" disabled>Create PDF</button>
<a class="download" id="download" download="screenshots.pdf" hidden>Download PDF</a>
<button id="save" hidden>Save to ChatGPT Library</button></div>
</fieldset>
<p id="status" role="status" aria-live="polite"></p>
<p class="muted">Conversion runs in your browser. To post one attachment, attach the finished PDF instead of the source images.</p>
</main>
<script>
'use strict';
const byId = id => document.getElementById(id);
const [input, list, quality, make, download, save, status, controls] =
  ['images','list','quality','make','download','save','status','controls'].map(byId);
const files = [];
let output, url;
const bytes = n => n < 1024 * 1024 ? Math.ceil(n / 1024) + ' KB' : (n / (1024 * 1024)).toFixed(2) + ' MB';

function invalidate() {
  if (url) URL.revokeObjectURL(url);
  output = url = null;
  download.removeAttribute('href');
  download.hidden = save.hidden = true;
}
function update() {
  invalidate();
  list.replaceChildren();
  list.hidden = !files.length;
  make.disabled = !files.length;
  files.forEach((file, i) => {
    const li = document.createElement('li'), row = document.createElement('div');
    row.className = 'row';
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = file.name + ' · ' + bytes(file.size);
    row.append(name);
    for (const [label, action, disabled] of [
      ['Up', () => [files[i-1],files[i]] = [files[i],files[i-1]], i === 0],
      ['Down', () => [files[i+1],files[i]] = [files[i],files[i+1]], i === files.length - 1],
      ['Remove', () => files.splice(i,1), false]
    ]) {
      const button = document.createElement('button');
      button.textContent = label;
      button.setAttribute('aria-label', label + ' ' + file.name);
      button.disabled = disabled;
      button.onclick = () => {
        action(); update();
        const next = label === 'Up' ? i - 1 : label === 'Down' ? i + 1 : Math.min(i, files.length - 1);
        (list.children[next]?.querySelector('button:not(:disabled)') || input).focus();
      };
      row.append(button);
    }
    li.append(row); list.append(li);
  });
  status.textContent = files.length ? files.length + ' selected · ' + bytes(files.reduce((a,f)=>a+f.size,0)) : '';
}
input.onchange = () => {
  let skipped = 0;
  for (const file of input.files) {
    if (files.length >= 50 || file.size > 25 * 1024 * 1024 ||
        !/^image\/(png|jpeg|webp)$/.test(file.type)) { skipped++; continue; }
    files.push(file);
  }
  input.value = '';
  update();
  if (skipped) status.textContent += (files.length ? '. ' : '') + skipped + ' skipped. Use PNG, JPEG or WebP files under 25 MB each, up to 50 total.';
};
quality.onchange = update;

async function toJpeg(file, compact) {
  const src = URL.createObjectURL(file);
  const canvas = document.createElement('canvas');
  try {
    const img = new Image();
    img.src = src;
    await img.decode();
    const scale = Math.min(1, (compact ? 1600 : 3000) / Math.max(img.naturalWidth, img.naturalHeight));
    canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
    canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
    const ctx = canvas.getContext('2d', {alpha:false});
    ctx.fillStyle = '#fff';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
    const jpeg = await new Promise((resolve,reject) => canvas.toBlob(
      blob => blob && blob.type === 'image/jpeg' ? resolve(blob) : reject(new Error('JPEG encoding failed')),
      'image/jpeg', compact ? .72 : .94));
    return {jpeg, width:canvas.width, height:canvas.height};
  } finally {
    canvas.width = canvas.height = 1;
    URL.revokeObjectURL(src);
  }
}

// The PDF stores each browser-encoded JPEG as an image stream with its own page.
function pdfWriter(count) {
  const encoder = new TextEncoder(), parts = [], offsets = [0];
  let pos = 0;
  function add(data) {
    const part = typeof data === 'string' ? encoder.encode(data) : data;
    parts.push(part); pos += part.byteLength ?? part.size;
  }
  function object(id, body) {
    offsets[id] = pos; add(id + ' 0 obj\n'); add(body); add('\nendobj\n');
  }
  add('%PDF-1.4\n');
  add(new Uint8Array([37,226,227,207,211,10]));
  object(1,'<< /Type /Catalog /Pages 2 0 R >>');
  object(2,'<< /Type /Pages /Count '+count+' /Kids ['+Array.from({length:count},(_,i)=>(3+3*i)+' 0 R').join(' ')+'] >>');
  return {
    page(i, {jpeg,width,height}) {
      const id = 3+3*i;
      const scale = Math.min(1, 792/Math.max(width,height));
      const w = (width*scale).toFixed(3), h = (height*scale).toFixed(3);
      object(id,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+w+' '+h+'] /Resources << /XObject << /Im '+(id+1)+' 0 R >> >> /Contents '+(id+2)+' 0 R >>');
      offsets[id+1] = pos;
      add((id+1)+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+width+' /Height '+height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpeg.size+' >>\nstream\n');
      add(jpeg); add('\nendstream\nendobj\n');
      const stream = 'q '+w+' 0 0 '+h+' 0 0 cm /Im Do Q\n';
      object(id+2,'<< /Length '+stream.length+' >>\nstream\n'+stream+'endstream');
    },
    finish() {
      const xref = pos;
      add('xref\n0 '+offsets.length+'\n0000000000 65535 f \n');
      for (const offset of offsets.slice(1)) add(String(offset).padStart(10,'0')+' 00000 n \n');
      add('trailer\n<< /Size '+offsets.length+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF\n');
      return new Blob(parts, {type:'application/pdf'});
    }
  };
}

make.onclick = async () => {
  invalidate();
  controls.disabled = true;
  try {
    const pdf = pdfWriter(files.length);
    for (let i = 0; i < files.length; i++) {
      status.textContent = 'Creating page ' + (i+1) + ' of ' + files.length + '…';
      try { pdf.page(i, await toJpeg(files[i], quality.value === 'compact')); }
      catch { throw new Error('Could not convert “' + files[i].name + '”. Remove it or export it again as PNG or JPEG.'); }
    }
    output = pdf.finish();
    url = URL.createObjectURL(output);
    download.href = url; download.hidden = false;
    save.hidden = typeof window.openai?.uploadFile !== 'function';
    status.textContent = files.length + (files.length === 1 ? ' page' : ' pages') + ' · ' +
      bytes(output.size) + ' PDF · ' + bytes(files.reduce((a,f)=>a+f.size,0)) + ' original';
  } catch (error) {
    status.textContent = error.message;
  } finally {
    controls.disabled = false;
  }
};
save.onclick = async () => {
  if (!output) return;
  controls.disabled = true;
  try {
    const result = await window.openai.uploadFile(new File([output], 'screenshots.pdf', {type:'application/pdf'}), {library:true});
    if (!result?.fileId) throw new Error();
    status.textContent = 'PDF uploaded to ChatGPT. Look for screenshots.pdf in your Library if available.';
  } catch {
    status.textContent = 'ChatGPT could not save the PDF. Use Download PDF to save a copy.';
  } finally {
    controls.disabled = false;
  }
};
// Notify an MCP Apps host when embedded; standalone mode needs no host.
if (parent !== window) {
  const initId = 'screenshot-pdf-init';
  window.addEventListener('message', event => {
    if (event.source === parent && event.data?.id === initId && event.data?.result) {
      parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized'}, '*');
    }
  });
  parent.postMessage({jsonrpc:'2.0',id:initId,method:'ui/initialize',params:{
    appInfo:{name:'Screenshot to PDF',version:'0.1.0'},appCapabilities:{},protocolVersion:'2026-01-26'
  }}, '*');
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(() => {
    parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/size-changed',params:{height:document.body.scrollHeight}}, '*');
  }).observe(document.querySelector('main'));
}
</script>
</body>
</html>
